[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "reader/web/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Standalone GUI checks must add the repository root before importing the app.
"tests/*smoke.py" = ["E402"]
"tests/desktop_registration.py" = ["E402"]
"scripts/*.py" = ["E402"]
